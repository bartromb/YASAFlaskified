name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install ruff
        # Gepind: ongepind kan een nieuwe ruff-release de poort rood maken
        # zonder dat er een regel code verandert. Deze check stond van
        # v0.19.16 tot v0.20.0 rood zonder dat iemand het merkte; een gate die
        # om externe redenen kan omvallen wordt genegeerd en is dan geen gate.
        run: pip install ruff==0.16.3
      - name: ruff check
        run: ruff check myproject

      - name: Install mypy
        # Gepind, om dezelfde reden als ruff: een nieuwe release mag de gate
        # niet rood maken zonder codewijziging.
        run: pip install mypy==2.3.0

      - name: mypy
        # Scope staat in [tool.mypy] in pyproject.toml -- de modules die al
        # schoon zijn. Zie de toelichting daar voor de ratel.
        run: mypy

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system deps for MNE/LightGBM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgomp1
      - name: Install poppler-utils (pdftotext)
        # De profielrapport-tests lezen de ECHT GERENDERDE PDF terug in plaats
        # van de story-objecten te inspecteren. Dat is de enige manier waarop
        # ze konden vangen dat ▶ in base-14 Helvetica als een blokje uitkomt --
        # een fout die in de code onzichtbaar is. Zonder pdftotext zouden elf
        # tests moeten worden overgeslagen, en een stil overgeslagen test is
        # geen test.
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run pytest
        run: pytest myproject/tests -v --tb=short

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image (smoke test only — no push)
        run: docker build -t yasaflaskified:ci .
      - name: Smoke-test image
        run: |
          docker run --rm yasaflaskified:ci python -c "import sys; print(sys.version)"
